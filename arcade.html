<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>הארקייד שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b1a;--bg2:#141432;--card:#1a1a3d;--line:#2d2d63;
    --text:#f3f3ff;--muted:#a3a3cc;--pink:#ff4fa3;--cyan:#38e1ff;--yellow:#ffd23f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--text);font-family:Rubik,"Segoe UI",Arial,sans-serif;overflow-x:hidden}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:40px 16px 60px}

  header{text-align:center;margin-bottom:34px}
  .logo{display:inline-flex;align-items:center;gap:14px}
  .logo-icon{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--cyan));display:grid;place-items:center;font-size:34px;box-shadow:0 0 30px rgba(255,79,163,.45);animation:float 3s ease-in-out infinite}
  h1{margin:0;font-size:clamp(38px,8vw,68px);font-weight:900;letter-spacing:-1px;
     background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{color:var(--muted);font-size:18px;margin:10px 0 0}

  .bar{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  .bar h2{margin:0;font-size:22px;font-weight:800}
  .bar h2 span{color:var(--muted);font-weight:600;font-size:16px}
  .search{flex:1;max-width:320px;min-width:200px;background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px 14px;color:var(--text);font:inherit;font-size:16px;outline:none;transition:border-color .2s}
  .search:focus{border-color:var(--cyan)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  .card{position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:22px;overflow:hidden;text-decoration:none;color:inherit;
        transition:transform .25s cubic-bezier(.2,.9,.3,1.4),border-color .25s,box-shadow .25s;animation:pop .5s backwards}
  .card:hover{transform:translateY(-8px) scale(1.02);border-color:var(--c1);box-shadow:0 14px 40px -10px var(--c1)}
  .thumb{aspect-ratio:1/0.78;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,var(--c2),var(--c1));position:relative;overflow:hidden}
  .thumb svg{width:62%;height:auto;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
  .card:hover .thumb svg{transform:scale(1.1) rotate(-4deg)}
  .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.25) 50%,transparent 60%);transform:translateX(-100%);transition:transform .7s}
  .card:hover .thumb::after{transform:translateX(100%)}
  .badge{position:absolute;top:12px;right:12px;background:var(--yellow);color:#1a1a3d;font-weight:800;font-size:13px;padding:4px 10px;border-radius:999px}
  .info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
  .info h3{margin:0;font-size:20px;font-weight:800}
  .info p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;flex:1}
  .play{margin-top:10px;align-self:flex-start;background:var(--c1);color:#fff;font-weight:800;padding:8px 18px;border-radius:12px;font-size:15px}

  .card.soon{border-style:dashed;cursor:default;opacity:.75}
  .card.soon:hover{transform:none;box-shadow:none;border-color:var(--line)}
  .card.soon .thumb{background:var(--bg2)}
  .card.soon .thumb span{font-size:64px;opacity:.5}

  .empty{display:none;text-align:center;color:var(--muted);padding:40px 0;font-size:18px}
  footer{text-align:center;color:var(--muted);margin-top:50px;font-size:14px}

  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
  @keyframes pop{from{opacity:0;transform:translateY(20px) scale(.95)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="wrap">
  <header>
    <div class="logo">
      <div class="logo-icon">🕹️</div>
      <h1>הארקייד שלי</h1>
    </div>
    <p class="tagline">כל המשחקים שלי במקום אחד. בוחרים משחק ונכנסים!</p>
  </header>

  <div class="bar">
    <h2>🎮 המשחקים <span id="count"></span></h2>
    <input class="search" id="search" type="search" placeholder="🔍 חיפוש משחק...">
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">לא נמצא משחק כזה 🤔</div>

  <footer>נבנה באהבה 💜</footer>
</div>

<script>
/* ===== כאן מוסיפים משחקים חדשים =====
   name  = שם המשחק
   desc  = תיאור קצר
   url   = הקישור למשחק
   logo  = איזה ציור (ball / star) — או אימוג'י כמו '⚽'
   c1,c2 = צבעי הרקע של הלוגו
   badge = מדבקה (למשל 'חדש!') — אפשר להשאיר ריק
*/
const GAMES = [
  {
    name:'כדור תותח',
    desc:'משחק כדורגל בתלת־ממד. בועטים, מבקיעים ומנצחים!',
    url:'https://elishagames1-cell.github.io/kadur-totach/',
    logo:'ball', c1:'#1f9d55', c2:'#7ee2a8', badge:'חדש!'
  },
  {
    name:'כדורגל בסגנון FIFA',
    desc:'משחק כדורגל מלא על המגרש. תעביר, תבעט ותנצח!',
    url:'https://elishagames1-cell.github.io/fifa-style-soccer/',
    logo:'⚽', c1:'#1d6fd1', c2:'#8fc4ff', badge:''
  },
  {
    name:'פלאפי בירד',
    desc:'תעוף בין הצינורות בלי להתרסק. כמה רחוק תגיע?',
    url:'https://elishagames1-cell.github.io/flappy-bird/',
    logo:'🐤', c1:'#e0a526', c2:'#ffe08a', badge:''
  },
];

const LOGOS = {
  ball:`<svg viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="46" fill="#fff" stroke="#1b1b1b" stroke-width="4"/>
    <polygon points="60,40 78,53 71,74 49,74 42,53" fill="#1b1b1b"/>
    <path d="M60 40V16M78 53l22-8M71 74l14 20M49 74L35 94M42 53l-22-8" stroke="#1b1b1b" stroke-width="4"/>
  </svg>`,
  star:`<svg viewBox="0 0 120 120" aria-hidden="true">
    <polygon points="60,10 74,44 110,46 82,70 92,106 60,86 28,106 38,70 10,46 46,44" fill="#ffd23f" stroke="#1b1b1b" stroke-width="4" stroke-linejoin="round"/>
  </svg>`
};

function logoHTML(l){
  return LOGOS[l] || `<svg viewBox="0 0 120 120" aria-hidden="true"><text x="60" y="80" font-size="64" text-anchor="middle">${l||'🎮'}</text></svg>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const grid=document.getElementById('grid'),search=document.getElementById('search');
function render(){
  const q=search.value.trim();
  const list=GAMES.filter(g=>!q||g.name.includes(q)||g.desc.includes(q));
  grid.innerHTML=list.map((g,i)=>`
    <a class="card" href="${esc(g.url)}" style="--c1:${g.c1};--c2:${g.c2};animation-delay:${i*70}ms">
      <div class="thumb">${logoHTML(g.logo)}${g.badge?`<span class="badge">${esc(g.badge)}</span>`:''}</div>
      <div class="info"><h3>${esc(g.name)}</h3><p>${esc(g.desc)}</p><span class="play">▶ שחק</span></div>
    </a>`).join('') + (q?'':`
    <div class="card soon" style="animation-delay:${list.length*70}ms">
      <div class="thumb"><span>➕</span></div>
      <div class="info"><h3>המשחק הבא</h3><p>בקרוב... 👀</p></div>
    </div>`);
  document.getElementById('count').textContent='('+GAMES.length+')';
  document.getElementById('empty').style.display=list.length?'none':'block';
}
search.addEventListener('input',render);
render();

/* רקע כוכבים זזים */
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let S=[];
function size(){cv.width=innerWidth;cv.height=innerHeight;S=Array.from({length:Math.min(160,innerWidth/6)},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.3,v:Math.random()*.4+.1,p:Math.random()*6}));}
function tick(t){ctx.clearRect(0,0,cv.width,cv.height);for(const s of S){s.y+=s.v;if(s.y>cv.height){s.y=0;s.x=Math.random()*cv.width;}ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.283);ctx.fill();}requestAnimationFrame(tick);}
addEventListener('resize',size);size();requestAnimationFrame(tick);
</script>
</body>
</html>
